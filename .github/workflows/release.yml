name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s (%h)' --no-merges)"
            RANGE_LINK="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            COMMITS="$(git log "${TAG}" -n 20 --pretty=format:'- %s (%h)' --no-merges)"
            RANGE_LINK=""
          fi
          NOTES="$(printf '### 更新内容\n\n%s\n\n%s\n' "$COMMITS" "$RANGE_LINK")"
          gh release create "$TAG" \
            --title "ssh4work $TAG" \
            --notes "$NOTES"
